<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ning Aroma - 專屬感官香氣測驗</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        .font-serif-luxury { font-family: 'Playfair Display', 'Noto Serif TC', serif; }
    </style>
</head>
<!-- 溫暖精緻的法式高訂粉白柔和背景 -->
<body id="body-layout" class="bg-[#FAF6F0] text-gray-800 font-serif-luxury antialiased min-h-screen flex flex-col justify-between">

    <!-- 頂部品牌區：極簡優雅 -->
    <nav class="border-b border-[#E8D7D0] bg-white/90 backdrop-blur-md px-8 py-5 flex justify-between items-center shadow-sm">
        <div class="text-2xl font-black tracking-widest text-[#C07C5F]">Ning Aroma</div>
        <button onclick="toggleDarkMode()" class="text-xs tracking-widest border-2 border-[#C07C5F] text-[#C07C5F] font-bold px-3 py-1 rounded-full uppercase hover:bg-[#FAF0EC]">Mode</button>
    </nav>

    <!-- 核心測驗主體 -->
    <main class="max-w-xl mx-auto px-6 py-10 w-full flex-grow flex flex-col justify-center">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-widest text-gray-900 mb-2 uppercase">Scent Mirror</h1>
            <p class="text-xs text-[#C07C5F] font-black tracking-widest uppercase bg-[#FAF0EC] py-1.5 px-5 rounded-full inline-block">鏡像靈魂 • 尋找妳的專屬香氣宣告</p>
        </header>

        <!-- 質感測驗卡片：邊框與陰影加強，突顯大器感 -->
        <div id="quiz-card" class="bg-white rounded-3xl p-8 shadow-2xl shadow-[#E8D7D0]/50 border-2 border-[#FAF0EC] transition-all">
            
            <!-- 測驗進行中區塊 -->
            <div id="question-container">
                <div class="flex justify-between items-center mb-8 border-b pb-4 border-gray-100">
                    <span id="question-number" class="text-xs tracking-widest text-[#C07C5F] font-black uppercase">Question 1 / 3</span>
                    <div class="w-24 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-[#C07C5F] transition-all duration-300" style="width: 33.3%;"></div>
                    </div>
                </div>
                <!-- 題目字體放大加粗 -->
                <h2 id="question-text" class="text-xl font-bold text-gray-900 leading-relaxed mb-8">題目載入中...</h2>
                <!-- 選項按鈕空間 -->
                <div id="options-space" class="flex flex-col gap-4"></div>
            </div>

            <!-- 結果開獎區塊 -->
            <div id="result-container" class="hidden text-center py-2">
                <span class="text-xs tracking-widest text-[#8C9E8C] uppercase font-black mb-2 block">Your Destiny Vibe</span>
                <h2 id="result-title" class="text-2xl font-black text-[#C07C5F] mb-4 tracking-wide">命定香氣</h2>
                <p id="result-description" class="text-gray-700 text-sm leading-relaxed mb-8 px-3 bg-[#FAF6F0] p-6 rounded-2xl border border-[#E8D7D0] font-medium"></p>
                
                <!-- 商品轉化推薦區 -->
                <div class="bg-gradient-to-br from-white to-[#FAF6F0] p-6 rounded-2xl border border-[#E8D7D0] text-left mb-8 shadow-sm">
                    <div class="flex gap-2 mb-3">
                        <div class="w-3 h-3 rounded-full" style="background-color: #E8D7D0;"></div>
                        <div class="w-3 h-3 rounded-full" style="background-color: #8C9E8C;"></div>
                        <div class="w-3 h-3 rounded-full" style="background-color: #C07C5F;"></div>
                    </div>
                    <h3 class="font-bold text-sm text-gray-900 mb-1">Ning Aroma 核心系列訂製噴霧 10ml</h3>
                    <p class="text-xs text-gray-500 font-sans">使用純天然植物精油，承襲國際 KDCA 認證工藝標準調配。</p>
                    <div class="flex justify-between items-center border-t pt-3 border-gray-100 mt-4">
                        <span class="font-bold text-xl text-[#C07C5F] tracking-wider">NT\$ 880</span>
                        <span class="text-xs text-[#C07C5F] bg-[#FAF0EC] px-3 py-1 rounded-full font-bold">體驗會限定商品</span>
                    </div>
                </div>

                <!-- 核心行動呼籲 CTA -->
                <button onclick="location.reload()" class="w-full bg-[#C07C5F] hover:bg-[#B06C50] text-white font-bold text-sm tracking-widest uppercase py-4 rounded-full shadow-lg shadow-[#C07C5F]/30 transition-all duration-300 active:scale-[0.98]">
                    預約體驗一對一高訂證照課程 (KDCA)
                </button>
            </div>

        </div>
    </main>

    <footer class="text-center py-8 text-xs font-bold text-gray-400 tracking-widest">
        © 2026 Ning Aroma. All Rights Reserved.
    </footer>

    <script>
        const quizData = [
            {
                q: "1. 咖啡廳中最吸引妳的角落？<br><span class='text-xs text-gray-400 font-sans block mt-1'>Your favorite corner?</span>",
                options: [
                    { text: "窗邊灑落陽光的白色亞麻沙發區 (Linen & Relax)", type: "C" },
                    { text: "擺滿復古木質桌椅與老書櫃的角落 (Wood & Focus)", type: "A" },
                    { text: "大理石吧檯旁、點著高奢金色蠟燭的座位 (Luxury Candle)", type: "B" }
                ]
            },
            {
                q: "2. 今天最想要的能量暗示？<br><span class='text-xs text-gray-400 font-sans block mt-1'>What energy vibe do you need?</span>",
                options: [
                    { text: "Focus 專注：排除雜音，回歸思緒澄澈", type: "A" },
                    { text: "Luxury 奢華：充滿氣場，展現獨立自信", type: "B" },
                    { text: "Relax 放鬆：純淨安全，溫柔包裹療癒", type: "C" }
                ]
            },
            {
                q: "3. 嚮往哪一種大自然的放鬆感？<br><span class='text-xs text-gray-400 font-sans block mt-1'>Which scenery relaxes you?</span>",
                options: [
                    { text: "雨後深夜，走在松針落葉的深山森林", type: "A" },
                    { text: "清晨第一道微光，灑在橙花樹上", type: "B" },
                    { text: "烘乾蓬鬆、帶有陽光氣息的亞麻布", type: "C" }
                ]
            }
        ];

        const resultData = {
            "A": { title: "霧界之森 ‧ 內省沉靜木質系", desc: "雪松的澄澈與岩蘭草的大地氣息，幫妳帶回強大的專注力（Focus）與滿滿的內心平靜。最適合相伴妳進行思考與獨立工作。" },
            "B": { title: "微光晨曦 ‧ 自信美學輕奢系", desc: "珍貴橙花的高雅與馬鞭草的明亮完美融合，散發出成熟、高奢（Luxury）且極具品味的女性香氛主理人氣場。全場焦點就是妳。" },
            "C": { title: "慵懶亞麻 ‧ 純淨舒適草本花香系", desc: "羅馬洋甘菊的微甜搭配乾淨的杜松子與甜馬鬱蘭，帶給妳徹底的放鬆（Relax）與如同躺在暖陽亞麻床單上的純淨安全感。" }
        };

        let currentQuestion = 0;
        let scoreTracker = { A: 0, B: 0, C: 0 };

        function renderQuestion() {
            if (currentQuestion < quizData.length) {
                const data = quizData[currentQuestion];
                document.getElementById("question-number").innerHTML = `Question ${currentQuestion + 1} / 3`;
                document.getElementById("progress-bar").style.width = `${(currentQuestion + 1) * 33.3}%`;
                document.getElementById("question-text").innerHTML = data.q;
                const space = document.getElementById("options-space");
                space.innerHTML = "";
                data.options.forEach(opt => {
                    const btn = document.createElement("button");
                    // 這裡特別放大了按鈕內的字體 (text-base) 並且加粗 (font-bold)，更方便閱讀點選
                    btn.className = "w-full text-left bg-white hover:bg-[#FAF0EC] border-2 border-[#E8D7D0] hover:border-[#C07C5F] px-6 py-5 rounded-2xl text-base font-bold text-gray-800 transition-all duration-150 active:scale-[0.99] shadow-sm";
                    btn.innerHTML = opt.text;
                    btn.onclick = () => handleAnswer(opt.type);
                    space.appendChild(btn);
                });
            } else { showResult(); }
        }

        function handleAnswer(type) { scoreTracker[type]++; currentQuestion++; renderQuestion(); }

        function showResult() {
            document.getElementById("question-container").classList.add("hidden");
            document.getElementById("result-container").classList.remove("hidden");
            let maxType = "B", maxScore = -1;
            for (let key in scoreTracker) { if (scoreTracker[key] > maxScore) { maxScore = scoreTracker[key]; maxType = key; } }
            const final = resultData[maxType];
            document.getElementById("result-title").innerHTML = final.title;
            document.getElementById("result-description").innerHTML = final.desc;
        }

        function toggleDarkMode() {
            const body = document.getElementById("body-layout");
            body.classList.toggle("bg-[#FAF6F0]"); body.classList.toggle("bg-gray-950");
            body.classList.toggle("text-gray-800"); body.classList.toggle("text-white");
        }
        renderQuestion();
    </script>
</body>
</html>
