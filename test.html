<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ning Aroma Quiz</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        .font-serif-luxury { font-family: 'Playfair Display', 'Noto Serif TC', serif; }
    </style>
</head>
<body id="body-layout" class="bg-[#FDFBF7] text-gray-800 font-serif-luxury antialiased">

    <nav class="border-b bg-white px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold tracking-widest text-[#C07C5F]">Ning Aroma</div>
        <button onclick="toggleDarkMode()" class="text-xs border px-3 py-1 rounded-full">Mode</button>
    </nav>

    <main class="max-w-xl mx-auto px-6 py-12">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2" id="main-title">Organic Tea Couture</h1>
            <p class="text-xs text-[#8C9E8C] tracking-widest">尋找妳的專屬香氣宣告</p>
        </header>

        <div id="quiz-card" class="bg-white rounded-3xl p-8 shadow-xl border border-gray-100">
            <div id="question-container">
                <div class="flex justify-between items-center mb-6">
                    <span id="question-number" class="text-xs text-[#C07C5F] font-bold">Q 1 / 3</span>
                    <div class="w-16 h-1 bg-gray-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-[#C07C5F]" style="width: 33%;"></div>
                    </div>
                </div>
                <h2 id="question-text" class="text-lg font-bold text-gray-900 mb-6">題目載入中...</h2>
                <div id="options-space" class="flex flex-col gap-3"></div>
            </div>

            <div id="result-container" class="hidden text-center py-4">
                <span class="text-xs text-[#8C9E8C] font-bold mb-1 block">Your Destiny Vibe</span>
                <h2 id="result-title" class="text-2xl font-bold text-gray-900 mb-3">命定香氣</h2>
                <p id="result-description" class="text-gray-600 text-sm mb-6 px-2"></p>
                
                <div class="bg-[#FDFBF7] p-5 rounded-2xl border text-left mb-6">
                    <h3 class="font-bold text-sm text-gray-900 mb-1">Ning Aroma 核心高訂噴霧 10ml</h3>
                    <p class="text-xs text-gray-500 mb-3">符合國際 KDCA 調香大師工藝標準，純精油調配。</p>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-[#C07C5F]">NT\$ 880</span>
                        <span class="text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded">體驗會限定商品</span>
                    </div>
                </div>

                <button onclick="location.reload()" class="w-full bg-[#C07C5F] text-white font-bold text-xs tracking-widest uppercase py-4 rounded-full shadow-lg">
                    預約體驗一對一高訂證照課程 (KDCA)
                </button>
            </div>
        </div>
    </main>

    <script>
        const quizData = [
            {
                q: "1. 咖啡廳中最吸引妳的角落？<br><span class='text-xs text-gray-400 font-sans'>Your favorite corner?</span>",
                options: [
                    { text: "陽光散落的白色亞麻沙發區 (Linen & Relax)", type: "C" },
                    { text: "復古木質桌椅與老書櫃角落 (Wood & Focus)", type: "A" },
                    { text: "點著高奢金色蠟燭的大理石位 (Luxury Candle)", type: "B" }
                ]
            },
            {
                q: "2. 今天最想要的能量暗示？<br><span class='text-xs text-gray-400 font-sans'>What energy vibe do you need?</span>",
                options: [
                    { text: "Focus 專注：排除雜音，思緒澄澈", type: "A" },
                    { text: "Luxury 奢華：滿滿氣場，獨立自信", type: "B" },
                    { text: "Relax 放鬆：純淨安全，溫柔療癒", type: "C" }
                ]
            },
            {
                q: "3. 嚮往哪一種大自然的放鬆感？<br><span class='text-xs text-gray-400 font-sans'>Which scenery relaxes you?</span>",
                options: [
                    { text: "雨後深夜，走在松針落葉的深山森林", type: "A" },
                    { text: "清晨第一道微光，灑在橙花樹上", type: "B" },
                    { text: "烘乾蓬鬆、帶有陽光氣息的亞麻布", type: "C" }
                ]
            }
        ];

        const resultData = {
            "A": { title: "霧界之森 ‧ 內省沉靜木質系", desc: "雪松的澄澈與岩蘭草的大地氣息，幫妳帶回專注力（Focus）與滿滿的內心平靜。最適合思考與獨立工作。" },
            "B": { title: "微光晨曦 ‧ 自信美學輕奢系", desc: "高貴橙花與明亮馬鞭草融合，散發出成熟、奢華（Luxury）且極具品味的女性微商主理人氣場。全場焦點就是妳。" },
            "C": { title: "慵懶亞麻 ‧ 純淨舒適草本花香系", desc: "羅馬洋甘菊的微甜搭配乾淨的杜松子，帶給妳徹底的放鬆（Relax）與如同躺在陽光亞麻床單上的純淨安全感。" }
        };

        let currentQuestion = 0;
        let scoreTracker = { A: 0, B: 0, C: 0 };

        function renderQuestion() {
            if (currentQuestion < quizData.length) {
                const data = quizData[currentQuestion];
                document.getElementById("question-number").innerHTML = `Q ${currentQuestion + 1} / 3`;
                document.getElementById("progress-bar").style.width = `${(currentQuestion + 1) * 33.3}%`;
                document.getElementById("question-text").innerHTML = data.q;
                const space = document.getElementById("options-space");
                space.innerHTML = "";
                data.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "w-full text-left bg-[#FDFBF7] border px-5 py-3.5 rounded-xl text-sm transition-all active:scale-[0.99]";
                    btn.innerHTML = opt.text;
                    btn.onclick = () => handleAnswer(opt.type);
                    space.appendChild(btn);
                });
            } else { showResult(); }
        }

        function handleAnswer(type) { scoreTracker[type]++; currentQuestion++; renderQuestion(); }

        function showResult() {
            document.getElementById("question-container").classList.add("hidden");
            document.getElementById("result-container").classList.remove("hidden");
            let maxType = "B", maxScore = -1;
            for (let key in scoreTracker) { if (scoreTracker[key] > maxScore) { maxScore = scoreTracker[key]; maxType = key; } }
            const final = resultData[maxType];
            document.getElementById("result-title").innerHTML = final.title;
            document.getElementById("result-description").innerHTML = final.desc;
        }

        function toggleDarkMode() {
            const body = document.getElementById("body-layout");
            body.classList.toggle("bg-[#FDFBF7]"); body.classList.toggle("bg-gray-900");
            body.classList.toggle("text-gray-800"); body.classList.toggle("text-white");
        }
        renderQuestion();
    </script>
</body>
</html>
